[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "skimindex"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "plumbum>=1.8.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocstrings[python]>=0.25",
    "mkdocs-material>=9.5",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", ".venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
download  = "skimindex._download:main"
decontam  = "skimindex._decontam:main"
genomes   = "skimindex._genomes:main"
validate  = "skimindex._validate:main"
